<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizer Chat</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --accent: #7c3aed;
      --border: #e2e8f0;
      --shadow: 0 24px 64px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding: 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.4rem);
    }

    .button {
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
      resize: vertical;
    }

    textarea {
      min-height: 120px;
    }

    .chat-area {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }

    .message {
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border);
      background: #f8fafc;
      max-width: 76%;
      line-height: 1.6;
    }

    .message.sent {
      margin-left: auto;
      background: rgba(124, 58, 237, 0.08);
      border-color: rgba(124, 58, 237, 0.18);
    }

    .message meta {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .message-list {
      display: grid;
      gap: 12px;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      .page {
        padding: 20px;
      }

      .message {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>Organizer Chat</h1>
        <p id="userIntro" style="margin:8px 0 0;color:var(--muted);">Loading organizer session...</p>
      </div>
      <a class="button" href="/dashboard">Back to dashboard</a>
    </div>

    <div class="panel">
      <label for="eventSelect">Select your event</label>
      <select id="eventSelect">
        <option value="">Loading your head organizer events...</option>
      </select>
      <p class="footer-note">Only events where you are the head organizer appear here.</p>
    </div>

    <div id="chatPanel" class="panel hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div>
          <h2 id="chatTitle" style="margin:0;font-size:1.25rem;">Chat with client</h2>
          <p id="chatSubtitle" style="margin:8px 0 0;color:var(--muted);">Select an event to view messages.</p>
        </div>
      </div>

      <div id="messages" class="message-list"></div>

      <form id="chatForm" class="chat-area">
        <label for="messageBody">New message</label>
        <textarea id="messageBody" placeholder="Type your message to the client" required></textarea>
        <button type="submit" class="button">Send Message</button>
      </form>
    </div>

    <p id="errorText" class="footer-note" style="color:#dc2626;"></p>
  </div>

  <script>
    const eventSelect = document.getElementById('eventSelect');
    const userIntro = document.getElementById('userIntro');
    const chatPanel = document.getElementById('chatPanel');
    const messagesContainer = document.getElementById('messages');
    const chatTitle = document.getElementById('chatTitle');
    const chatSubtitle = document.getElementById('chatSubtitle');
    const messageBody = document.getElementById('messageBody');
    const chatForm = document.getElementById('chatForm');
    const errorText = document.getElementById('errorText');

    let currentUser = null;
    let currentEvents = [];
    let activeEventId = '';

    function renderMessages(messages, currentUserId) {
      if (!messages || !messages.length) {
        messagesContainer.innerHTML = '<p style="color: var(--muted); margin: 0;">No messages yet for this event.</p>';
        return;
      }

      messagesContainer.innerHTML = messages
        .map((message) => {
          const isSent = message.senderId === currentUserId;
          return `
            <div class="message ${isSent ? 'sent' : ''}">
              <meta>${message.senderRole} • ${new Date(message.createdAt).toLocaleString()}</meta>
              <div>${message.body}</div>
            </div>
          `;
        })
        .join('');
    }

    async function loadUser() {
      try {
        const response = await fetch('/api/auth/me', { credentials: 'include' });
        if (!response.ok) throw new Error('Unable to load user');
        const data = await response.json();
        currentUser = data.user || {};
        userIntro.textContent = `Signed in as ${currentUser.firstName || currentUser.name || 'Organizer'}`;
        await loadEvents();
      } catch (error) {
        errorText.textContent = 'Unable to load your organizer session. Please sign in first.';
        eventSelect.innerHTML = '<option value="">Sign in to see events</option>';
      }
    }

    async function loadEvents() {
      try {
        const response = await fetch('/api/events');
        if (!response.ok) throw new Error('Unable to load events');
        const data = await response.json();
        const events = Array.isArray(data.events) ? data.events : [];
        currentEvents = events.filter((event) => event.headOrganizerId === currentUser.user_id);

        if (!currentEvents.length) {
          eventSelect.innerHTML = '<option value="">No head organizer events found</option>';
          errorText.textContent = 'You are not currently head organizer for any event.';
          return;
        }

        eventSelect.innerHTML = '<option value="">Select an event</option>' +
          currentEvents.map((event) => `
            <option value="${event.id}">${event.title || event.eventType || 'Unnamed event'} (${new Date(event.startDate || event.eventDate || '').toLocaleDateString() || 'no date'})</option>
          `).join('');
      } catch (error) {
        errorText.textContent = 'Unable to load events. Please try again later.';
        eventSelect.innerHTML = '<option value="">Unable to load events</option>';
      }
    }

    async function loadMessages(eventId) {
      if (!eventId) {
        chatPanel.classList.add('hidden');
        return;
      }

      try {
        errorText.textContent = '';
        const event = currentEvents.find((item) => item.id === eventId);
        if (!event) {
          throw new Error('Selected event is not assigned to you.');
        }

        chatTitle.textContent = `Chat for ${event.title || 'Event'}`;
        chatSubtitle.textContent = `Client: ${event.clientId || 'unknown'}`;

        const response = await fetch(`/api/events/${eventId}/messages`, { credentials: 'include' });
        if (!response.ok) {
          throw new Error('Unable to load chat messages');
        }

        const data = await response.json();
        renderMessages(Array.isArray(data.messages) ? data.messages : [], currentUser.user_id);
        chatPanel.classList.remove('hidden');
      } catch (error) {
        errorText.textContent = error.message;
        chatPanel.classList.add('hidden');
      }
    }

    eventSelect.addEventListener('change', (event) => {
      activeEventId = event.target.value;
      loadMessages(activeEventId);
    });

    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorText.textContent = '';

      if (!activeEventId) {
        errorText.textContent = 'Please choose an event first.';
        return;
      }

      const content = messageBody.value.trim();
      if (!content) {
        errorText.textContent = 'Enter a message before sending.';
        return;
      }

      try {
        const response = await fetch(`/api/events/${activeEventId}/messages`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ content }),
          credentials: 'include',
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data?.error || 'Unable to send message');
        }

        messageBody.value = '';
        await loadMessages(activeEventId);
      } catch (error) {
        errorText.textContent = error.message;
      }
    });

    loadUser();
  </script>
</body>
</html>

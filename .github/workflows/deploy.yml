name: Deploy to Lambda

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install --production

      - name: Zip project
        run: zip -r function.zip . --exclude "*.git*" --exclude "*.env*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Upload to Lambda
        env:
          STACK_NAME: schatzies-events
        run: |
          LAMBDA_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" --output text)

          echo "Deploying to Lambda function: $LAMBDA_NAME"

          aws lambda update-function-code \
            --function-name $LAMBDA_NAME \
            --zip-file fileb://function.zip

      - name: Seed admin user
        run: node scripts/seed-admin.js
        env:
          AWS_REGION: ap-southeast-1
          TABLE_NAME: schatzies_main_table
          ADMIN_HASH: ${{ secrets.ADMIN_SEED_HASH }}

      - name: Seed packages
        run: node scripts/seed-packages.js
        env:
          AWS_REGION: ap-southeast-1
          TABLE_NAME: schatzies_main_table